<html lang="en">

<title>WattWise — Smart Energy Coach</title>

<link rel="icon" type="image/png" href="Logo.png.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #0b0f19;
  --card: rgba(21, 29, 46, 0.7);
  --card-hover: rgba(30, 41, 64, 0.85);
  --bd: rgba(255, 255, 255, 0.08);
  --tx: #f1f5f9;
  --mu: #94a3b8;
  --bl: #2563eb;
  --cyan: #06b6d4;
  --tl: #10b981;
  --rd: #f43f5e;
  --amber: #f59e0b;
}

* { box-sizing: border-box; transition: background 0.2s, border-color 0.2s, transform 0.2s; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--tx); font-family: 'Inter', 'Noto Sans Thai', system-ui, sans-serif; min-height: 100vh; }

body { 
  display: flex; 
  background-image: 
    radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.12) 0%, transparent 50%),
    radial-gradient(circle at 100% 100%, rgba(6, 182, 212, 0.08) 0%, transparent 40%);
}

/* Sidebar Navigation */
nav {
  width: 260px;
  padding: 32px 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  background: rgba(11, 15, 25, 0.85);
  backdrop-filter: blur(20px);
  border-right: 1px solid var(--bd);
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  font-weight: 700;
  font-size: 24px;
  letter-spacing: -0.5px;
  margin-bottom: 32px;
  color: #fff;
}

.logo img {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
  object-fit: cover;
}

nav button {
  all: unset;
  cursor: pointer;
  padding: 14px 18px;
  border-radius: 14px;
  color: var(--mu);
  font-weight: 500;
  font-size: 15px;
  display: flex;
  align-items: center;
  gap: 10px;
}

nav button:hover { background: rgba(255, 255, 255, 0.04); color: var(--tx); }
nav button.on { 
  background: rgba(37, 99, 235, 0.15); 
  color: #60a5fa; 
  border: 1px solid rgba(96, 165, 250, 0.25); 
  font-weight: 600; 
}

/* Main Layout */
main { flex: 1; padding: 40px; max-width: 1040px; margin: 0 auto; }

.eyebrow { color: var(--cyan); font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
h1 { margin: 6px 0 8px; font-size: 32px; font-weight: 600; letter-spacing: -0.5px; }
.sub { color: var(--mu); margin: 0 0 28px; font-weight: 300; font-size: 15px; }

/* Cards (Ventriloc Style) */
.card {
  background: var(--card);
  backdrop-filter: blur(16px);
  border: 1px solid var(--bd);
  border-radius: 24px;
  padding: 26px;
  margin-bottom: 20px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.25);
}

.big { font-size: 36px; font-weight: 700; letter-spacing: -1px; color: #fff; margin: 6px 0; }
.mu { color: var(--mu); font-size: 14px; }

/* Dynamic Progress Bar */
.bar { height: 12px; background: rgba(255, 255, 255, 0.06); border-radius: 99px; overflow: hidden; margin: 14px 0; }
.bar b { display: block; height: 100%; background: linear-gradient(90deg, var(--bl), var(--cyan)); border-radius: 99px; }

.row { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

label { display: block; font-weight: 500; font-size: 14px; margin: 10px 0 6px; color: var(--tx); }
input, select {
  width: 100%;
  padding: 12px 16px;
  border: 1px solid var(--bd);
  border-radius: 12px;
  background: rgba(15, 23, 42, 0.6);
  color: var(--tx);
  font: inherit;
  outline: none;
}
input:focus, select:focus { border-color: var(--bl); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2); }

/* Buttons */
.btn {
  all: unset;
  cursor: pointer;
  background: linear-gradient(135deg, var(--bl), #1d4ed8);
  color: #fff;
  padding: 12px 22px;
  border-radius: 12px;
  font-weight: 600;
  font-size: 14px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
}
.btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4); }
.btn.g { background: rgba(255, 255, 255, 0.05); color: var(--tx); border: 1px solid var(--bd); box-shadow: none; }
.btn.g:hover { background: rgba(255, 255, 255, 0.1); }
.x { all: unset; cursor: pointer; color: var(--rd); font-size: 13px; font-weight: 500; }
.x:hover { text-decoration: underline; }

/* Alerts & Status Chips */
.alert {
  background: rgba(244, 63, 94, 0.12);
  border: 1px solid rgba(244, 63, 94, 0.3);
  color: #fda4af;
  padding: 16px 20px;
  border-radius: 16px;
  margin-bottom: 24px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 10px;
}
.alert.ok {
  background: rgba(16, 185, 129, 0.12);
  border-color: rgba(16, 185, 129, 0.3);
  color: #6ee7b7;
}

.chip {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 99px;
  background: rgba(255, 255, 255, 0.06);
  font-size: 12px;
  font-weight: 600;
  color: var(--cyan);
}

.tip { display: flex; gap: 16px; }

/* Plot / Chart */
.plot { position: relative; height: 180px; display: flex; gap: 4px; align-items: flex-end; margin-top: 20px; }
.col { flex: 1; height: 100%; display: flex; align-items: flex-end; cursor: pointer; }
.stk { display: flex; flex-direction: column-reverse; width: 100%; border-radius: 6px 6px 0 0; overflow: hidden; }
.stk.over { box-shadow: 0 -4px 12px rgba(244, 63, 94, 0.5); }
.stk.fut { background: rgba(255, 255, 255, 0.05); }
.stk.today { outline: 2px solid var(--cyan); }
.stk.sel { outline: 2px solid var(--bl); }
.seg { width: 100%; }
.lim { position: absolute; left: 0; right: 0; border-top: 2px dashed var(--tl); z-index: 2; opacity: 0.8; }
.lab { display: flex; gap: 4px; margin-top: 8px; }
.lab span { flex: 1; text-align: center; font-size: 11px; color: var(--mu); }
.lg { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--mu); margin-top: 14px; }
.lg i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; }
.ctl { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 16px; }
.ctl input { width: 160px; }

.item { padding: 14px 0; border-top: 1px solid var(--bd); }

/* Responsive Mobile (Safari iOS) */
@media(max-width: 800px) {
  body { flex-direction: column-reverse; }
  nav {
    width: 100%;
    flex-direction: row;
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    position: sticky;
    bottom: 0;
    z-index: 100;
    border-right: 0;
    border-top: 1px solid var(--bd);
    justify-content: space-around;
  }
  .logo { display: none; }
  nav button { flex: 1; text-align: center; justify-content: center; font-size: 13px; padding: 10px 0; }
  main { padding: 24px 16px 100px; }
  .grid { grid-template-columns: 1fr; }
  .big { font-size: 30px; }
}

.mini h4{margin:0 0 2px;font-size:13px;color:#93c5fd}.mini small{color:var(--mu);font-size:11px}.mini .n{font-size:24px;font-weight:700;margin:6px 0 2px}

<body>
<nav>
  <div class="logo"><img src="Logo.png.png" alt="WattWise" onerror="this.style.display='none'">WattWise</div>
  <button data-p="home" class="on">Overview</button>
  <button data-p="data">Rooms &amp; devices</button>
  <button data-p="tips">Tips</button>
  <button data-p="set">Settings</button>
  <div class="sp"></div>
  <button data-p="hub">All services</button>
  <button data-p="out">Sign out</button>
</nav>
<div id="entry"></div>
<main id="v"></main>
<script>
// calculate.js — สูตรคำนวณค่าไฟ WattWise (ข้อ 4 + ตัวช่วยข้อ 6 และ 8)
// ใช้ได้ทั้ง <script type="module"> และ import ใน React/HTML ธรรมดา
// หมายเหตุ: ค่าตัวคูณทั้งหมดเป็น "ค่าเริ่มต้นสมมติ" ไม่ใช่ค่าจากงานวิจัย
// ให้ปรับด้วยข้อมูลจริงจาก Smart Plug (ข้อ 8)

// ตัวคูณ [ต่ำสุด, สูงสุด] ของแอร์ ตามทิศห้อง
const ORIENTATION_FACTOR = {
  north: [1.0, 1.05],
  east:  [1.0, 1.05],
  south: [1.05, 1.15],
  west:  [1.1, 1.2],
};

// ตัวคูณตามอายุแอร์ (ปี) -> [ต่ำสุด, สูงสุด]
function ageFactor(years) {
  if (years < 3) return [1.0, 1.0];
  if (years <= 7) return [1.05, 1.1];
  return [1.15, 1.25];
}

// แอร์ไม่ได้กินไฟเต็ม Watt บนฉลากตลอดเวลา (คอมเพรสเซอร์ตัด/ต่อ)
// duty cycle = สัดส่วนที่ทำงานจริง [ต่ำสุด, สูงสุด] (ค่าสมมติ ให้ปรับด้วยข้อมูลจริง)
const AC_DUTY_CYCLE = [0.5, 0.8];

// สัดส่วนเวลาที่เครื่องกินไฟจริงตามประเภท [ต่ำสุด, สูงสุด] (ค่าสมมติเริ่มต้น ต้องปรับตามผลวัดจริง)
const TYPE_DUTY = {
  ac: AC_DUTY_CYCLE,
  fridge: [0.3, 0.5],     // คอมเพรสเซอร์ตัด-ต่อ
  fan: [1, 1],
  tv: [1, 1],
  computer: [0.5, 1.0],   // ตอนว่างกับตอนโหลดหนักต่างกัน
  lighting: [1, 1],
  heater: [0.3, 0.6],     // เทอร์โมสตัทตัด-ต่อ
  other: [1, 1],
};

// ความไม่แน่นอนของชั่วโมงใช้งาน (±20% ถ้าผู้ใช้ไม่ระบุช่วง)
const HOURS_UNCERTAINTY = 0.2;

function daysInMonth(date = new Date()) {
  return new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
}

// ตัวคูณสึกหรอของเครื่องทั่วไปตามอายุ [ต่ำสุด, สูงสุด] (ค่าสมมติ) ถ้าไม่ทราบอายุ = ช่วงกว้างขึ้น
function applianceAgeFactor(years) {
  if (years == null || Number.isNaN(years)) return [1.0, 1.15];
  if (years < 5) return [1.0, 1.0];
  if (years <= 10) return [1.0, 1.1];
  return [1.05, 1.25];
}

// ตัวคูณตามสภาพเครื่อง (ค่าสมมติ): ไม่ระบุ = normal
const CONDITION_FACTOR = {
  new:    [1.0, 1.0],
  normal: [1.0, 1.05],
  old:    [1.1, 1.3],   // เก่า/สกปรก/ซีลเสื่อม
  faulty: [1.3, 1.6],   // มีอาการผิดปกติ เช่น ทำงานไม่หยุด ไม่ค่อยเย็น
};

/**
 * คำนวณต่อเครื่อง
 * appliance = {
 *   name, type: 'ac' | 'other', watts, hoursPerDay,
 *   hoursMin?, hoursMax?,
 *   ageYears?,                      // ไม่ทราบ = เว้นว่าง
 *   condition?: 'new'|'normal'|'old'|'faulty',
 *   measuredWatts?,                 // วัตต์ที่วัดจริง (ถ้ามี จะไม่คูณตัวสึกหรอซ้ำ)
 *   orientation?                    // ใช้เฉพาะแอร์
 * }
 */
function estimateAppliance(appliance, ratePerKwh) {
  const { hoursPerDay, type } = appliance;
  const measured = appliance.measuredWatts > 0;
  const watts = measured ? appliance.measuredWatts : appliance.watts;
  const hMin = appliance.hoursMin ?? hoursPerDay * (1 - HOURS_UNCERTAINTY);
  const hMax = appliance.hoursMax ?? hoursPerDay * (1 + HOURS_UNCERTAINTY);

  // แต่ละแหล่งความไม่แน่นอน = ช่วง [ต่ำ, สูง]
  const duty = TYPE_DUTY[type] ?? [1, 1];
  const factors = [duty];
  if (type === 'ac') factors.push(ORIENTATION_FACTOR[appliance.orientation] ?? [1.0, 1.1]);
  if (!measured) {
    factors.push(type === 'ac' && appliance.ageYears != null
      ? ageFactor(appliance.ageYears) : applianceAgeFactor(appliance.ageYears));
    factors.push(CONDITION_FACTOR[appliance.condition] ?? CONDITION_FACTOR.normal);
  }

  // ค่ากลาง = ชั่วโมงกลาง x ค่ากลางของทุกตัวคูณ
  const mid = (f) => (f[0] + f[1]) / 2;
  const expKwh = (watts * hoursPerDay * factors.reduce((p, f) => p * mid(f), 1)) / 1000;

  // ช่วงที่น่าจะเป็น: รวมความไม่แน่นอนแบบอิสระ (root-sum-square) ไม่ใช่เอาค่าแย่สุด/ดีสุดมาคูณพร้อมกัน
  // (ประมาณการเชิงฮิวริสติก ไม่ใช่ช่วงความเชื่อมั่นทางสถิติ)
  const rel = (f) => (f[1] - f[0]) / (f[1] + f[0]);
  const w = Math.sqrt([[hMin, hMax], ...factors].reduce((s, f) => s + rel(f) ** 2, 0));
  const kwhDay = { min: expKwh * (1 - w), expected: expKwh, max: expKwh * (1 + w) };
  const costDay = {
    min: kwhDay.min * ratePerKwh,
    expected: kwhDay.expected * ratePerKwh,
    max: kwhDay.max * ratePerKwh,
  };
  return { name: appliance.name, kwhDay, costDay };
}

/**
 * คำนวณรวมทั้งห้อง ทั้งเดือน
 * คืน { perAppliance, daily: {min,expected,max}, monthly: {min,expected,max} }
 * calibrationFactor: ตัวปรับจากข้อ 8 (ค่าเริ่มต้น 1)
 */
function estimateRoom(appliances, ratePerKwh, days = daysInMonth(), calibrationFactor = 1) {
  const perAppliance = appliances.map((a) => estimateAppliance(a, ratePerKwh));
  const sum = (key) =>
    perAppliance.reduce((s, r) => s + r.costDay[key], 0) * calibrationFactor;

  const exp = sum('expected');
  const sd = Math.sqrt(perAppliance.reduce((s, r) => s + ((r.costDay.max - r.costDay.min) / 2) ** 2, 0)) * calibrationFactor;
  const daily = { min: Math.max(0, exp - sd), expected: exp, max: exp + sd };
  const monthly = {
    min: daily.min * days,
    expected: daily.expected * days,
    max: daily.max * days,
  };
  return { perAppliance, daily, monthly };
}

// ---------- ข้อ 6: งบรายวัน + แจ้งเตือน ----------
function dailyBudget(monthlyBudget, date = new Date()) {
  return monthlyBudget / daysInMonth(date);
}

// คืน null ถ้ายังไม่เกิน, คืนข้อความถ้าเกิน
function checkBudgetAlert(todayCost, monthlyBudget, date = new Date()) {
  const limit = dailyBudget(monthlyBudget, date);
  if (todayCost <= limit) return null;
  return `Used ${todayCost.toFixed(0)} THB today (over the daily budget of ${limit.toFixed(2)} THB)`;
}

// ---------- ข้อ 8: Calibrate ----------
// measuredKwh = ค่าจริงจาก Smart Plug, estimatedKwh = ค่าที่สูตรคำนวณ
// ใช้เฉลี่ยหลายวันจะนิ่งกว่าวันเดียว
function calibrationFactor(measuredKwh, estimatedKwh) {
  if (!estimatedKwh) return 1;
  return measuredKwh / estimatedKwh;
}

// ---------- รับค่าวัตต์จาก ESP32 ----------
// prev/next = {t: เวลา(ms), w: วัตต์}  คืนค่า kWh ระหว่างสองจุด (ค่าเฉลี่ยของสองจุด × เวลา)
// ถ้าห่างกันเกิน maxGapSec (อุปกรณ์หลุดออฟไลน์) จะนับแค่ maxGapSec เพื่อไม่เกินจริง
function kwhStep(prev, next, maxGapSec = 600) {
  const dt = (next.t - prev.t) / 1000;
  if (!(dt > 0)) return 0;
  return (((prev.w + next.w) / 2) * Math.min(dt, maxGapSec)) / 3600 / 1000;
}

// รวม kWh จากรายการ samples [{t, w}, ...] เรียงตามเวลา
function kwhFromSamples(samples, maxGapSec = 600) {
  let kwh = 0;
  for (let i = 1; i < samples.length; i++) kwh += kwhStep(samples[i - 1], samples[i], maxGapSec);
  return kwh;
}

 <button class="btn" id="add">+ Add appliance</button>
 ${man.length?(()=>{const t={min:0,expected:0,max:0};let v2=0;man.forEach(([it])=>{const e=est(it),k=dd(it);t.expected+=e.expected*k;v2+=((e.max-e.min)/2*k)**2});const sd=Math.sqrt(v2);t.min=Math.max(0,t.expected-sd);t.max=t.expected+sd;

tips(){const r=calc(),now=new Date(),d=now.getDate(),n=daysInMonth(now),y=now.getFullYear(),m=now.getMonth(),by=realByDevice(now),
